version: '3.8'

services:
  app:
    build: .
    container_name: sandeep-ai-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    networks:
      - ai-network

  # Optional local vector database (ChromaDB)
  chroma-vector-db:
    image: chromadb/chroma:latest
    container_name: sandeep-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  chroma-data:
